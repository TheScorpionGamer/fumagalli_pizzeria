<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prenota Ora!</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav  class="navigation-bar">
            <ul class="navigation-bar-list">
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="menu.html">Menu</a>
                </li>
                <li>
                    <a href="prenota.html">Prenota Ora!</a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="prenota">
            <form>
                <br>
                <p>Nome Prenotazione</p>
                <input type="text" required placeholder="Ambrogio Fumagalli">
                <p>Email (opzionale)</p>
                <input type="email" placeholder="fumagalli@example.com">
                <p>Data e Ora della prenotazione</p>
                <input type="datetime-local" required>
                <p>Numero di persone</p>
                <input type="number" required placeholder="1">
                <p>Numero di telefono <br><i>(Ti contatteremo per confermare la prenotazione)</i></p>
                <input type="text" required placeholder="+39 0000000000">
                <br><br>
                <button type="submit">Conferma Prenotazione</button>
                <br><br><br>
            </form>
        </section>
    </main>
    <br><br><br>
    <footer><strong><i>Fumagalli Pizzeria - Tutti i diritti riservati</i></strong></footer>
</body>
</html>
